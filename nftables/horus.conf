#!/usr/sbin/nft -f

flush ruleset

# Firewall Horus
table inet filter {

    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback
        iif lo accept

        # Conexiones ya establecidas o relacionadas
        ct state established,related accept

        # SSH, HTTP, HTTPS, CORREO, DNS
        tcp dport 22 ct state new accept
        tcp dport 25 ct state new accept
        tcp dport 80 ct state new accept
        tcp dport 443 ct state new accept
        udp dport 53 ct state new accept
        tcp dport 53 ct state new accept
	ip protocol icmp accept
    }

    chain output {
        type filter hook output priority 0; policy drop;
	oif lo accept

        # Permitir nuevas conexiones y respuestas
        ct state established,related accept

	# SSH, HTTP, HTTPS, CORREO, DNS
        tcp dport 22 ct state new accept
        tcp dport 25 ct state new accept
        tcp dport 80 ct state new accept
        tcp dport 443 ct state new accept
        udp dport 53 ct state new accept
        tcp dport 53 ct state new accept

	# Logs a Anubis
        ip daddr 172.16.0.200 tcp dport 514 ct state new accept
        ip daddr 172.16.0.200 udp dport 514 accept

        # ICMP saliente para ping y traceroute
        ip protocol icmp accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # Permitir tráfico Docker -> Internet
        iifname "docker0" oifname "eth0" ct state new,established,related accept
        iifname "br-" oifname "eth0" ct state new,established,related accept

        # Permitir tráfico Internet -> Docker (respuestas)
        iifname "eth0" oifname "docker0" ct state established,related accept
        iifname "eth0" oifname "br-" ct state established,related accept

        # Permitir forward entre docker0 y bridges (interconexión contenedores)
        iifname "docker0" oifname "br-" ct state new,established,related accept
        iifname "br-" oifname "docker0" ct state new,established,related accept
    }
}

# NAT para contenedores Docker
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept

        # Mascarade para todas las redes docker
        oifname "eth0" ip saddr 172.18.0.0/16 masquerade
    }
}
